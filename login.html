<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Iniciar sesión | GUCA Construcciones</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js_files/supabaseClient.js"></script>
    <script defer src="js_files/auth.js"></script>
</head>

<body class="login-page">
<header>
    <div class="container nav-bar">
        <a class="logo logo-link" href="index.html">
            <img src="assets/logo-placeholder.png" alt="Logo Construcciones GUCA" />
            <span class="logo-title">GUCA Construcciones</span>
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="suministros.html">Suministros</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="login-main">
    <section class="login-section">
        <div class="container login-layout">
            <div class="login-info">
                <span class="home-kicker">Acceso seguro</span>
                <h1>Iniciar sesión</h1>
                <p>
                    Accede con tu correo y contraseña. El panel administrativo solo está
                    disponible para usuarios autorizados.
                </p>
            </div>

            <form id="loginForm" class="login-card">
                <h2>Entrar a GUCA</h2>

                <div class="field">
                    <label for="loginEmail">Correo electrónico</label>
                    <input
                            id="loginEmail"
                            type="email"
                            placeholder="correo@ejemplo.com"
                            required
                    />
                </div>

                <div class="field">
                    <label for="loginPassword">Contraseña</label>
                    <input
                            id="loginPassword"
                            type="password"
                            placeholder="Tu contraseña"
                            required
                    />
                </div>

                <button type="submit" class="btn btn-primary login-submit">
                    Iniciar sesión
                </button>

                <div class="login-divider">
                    <span>o</span>
                </div>

                <button type="button" class="google-login-btn" id="googleLoginBtn">
                    <span class="google-g" aria-hidden="true">
                        <svg viewBox="0 0 48 48">
                            <path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.5l6.6-6.6C35.4 2.7 30.2.5 24 .5 14.8.5 6.9 5.8 3.1 13.5l7.7 6C12.6 13.6 17.8 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.5 2.8-2.2 5.2-4.7 6.8l7.3 5.7c4.3-4 7.2-9.8 7.2-16.5z"/>
                            <path fill="#FBBC05" d="M10.8 28.5c-.5-1.4-.8-2.9-.8-4.5s.3-3.1.8-4.5l-7.7-6C1.5 16.7.5 20.2.5 24s1 7.3 2.6 10.5l7.7-6z"/>
                            <path fill="#34A853" d="M24 47.5c6.2 0 11.4-2 15.3-6.5L32 35.3c-2 1.3-4.6 2.2-8 2.2-6.2 0-11.4-4.1-13.2-9.6l-7.7 6C6.9 42.2 14.8 47.5 24 47.5z"/>
                        </svg>
                    </span>

                    <span>Continuar con Google</span>
                </button>

                <p id="loginMessage" class="msg" aria-live="polite"></p>

                <hr class="login-divider" />
            </form>
        </div>
    </section>
</main>

<footer>
    <div class="footer-inner">
        <span class="footer-copy">
            GUCA Construcciones. Todos los derechos reservados. © <span id="year"></span>
        </span>
    </div>
</footer>
</body>
</html>
